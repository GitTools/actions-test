name: CI
on: [ push, pull_request, workflow_dispatch ]

jobs:
  GitVersion_v7:
    name: GitVersion v7
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-2025-vs2026, ubuntu-26.04, macos-26 ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v5.0.0
        name: Install GitVersion
        with:
          versionSpec: '7.0.x'
          includePrerelease: true

      - uses: gittools/actions/gitversion/execute@v5.0.0
        name: Use GitVersion
        with:
          configFilePath: 'GitVersion_v7.yml'
          overrideConfig: |
            calculation.semantic-version-format=Loose
        id: version_step # step id used as a reference for output values

      - run: |
          echo "FullSemVer (env.fullSemVer)                                   : ${{ env.fullSemVer }}"
          echo "FullSemVer (env.GitVersion_FullSemVer)                        : ${{ env.GitVersion_FullSemVer }}"
          echo "FullSemVer (steps.version_step.outputs.fullSemVer)            : ${{ steps.version_step.outputs.fullSemVer }}"
          echo "FullSemVer (steps.version_step.outputs.GitVersion_FullSemVer) : ${{ steps.version_step.outputs.GitVersion_FullSemVer }}"
        name: Use variables and output