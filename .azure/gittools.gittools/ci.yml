trigger:
  paths:
    include:
      - .azure/gittools.gittools/ci.yml

variables:
  system.debug: 'true'

stages:
  - stage: GitVersion
    displayName: Use GitVersion
    jobs:
      - job: GitVersion_v7
        displayName: GitVersion v7
        strategy:
          matrix:
            windows-2025-vs2026:
              imageName: 'windows-2025-vs2026'
            ubuntu-26.04:
              imageName: 'ubuntu-26.04'
            macos-26:
              imageName: 'macos-26'
        pool:
          vmImage: $(imageName)
        steps:
          - checkout: self
            fetchDepth: 0

          - task: gittools.gittools.setup-gitversion-task.gitversion-setup@5.0.0
            displayName: Install GitVersion
            inputs:
              versionSpec: '7.0.x'

          - task: gittools.gittools.execute-gitversion-task.gitversion-execute@5.0.0
            name: version_step # step id used as a reference for output values
            displayName: Use GitVersion
            inputs:
              configFilePath: 'GitVersion_v7.yml'
              buildNumberFormat: 'v${GitVersion_MajorMinorPatch}'
              overrideConfig: |
                calculation.semantic-version-format=Loose

          - pwsh: |
              echo "FullSemVer (fullSemVer)                         : $(fullSemVer)"
              echo "FullSemVer (GitVersion_FullSemVer)              : $(GitVersion_FullSemVer)"
              echo "FullSemVer (version_step.fullSemVer)            : $(version_step.fullSemVer)"
              echo "FullSemVer (version_step.GitVersion_FullSemVer) : $(version_step.GitVersion_FullSemVer)"
            displayName: Use variables and output
      - job: GitVersion_v7_no_config_file
        displayName: GitVersion v7 (no config file)
        strategy:
          matrix:
            windows-2025-vs2026:
              imageName: 'windows-2025-vs2026'
            ubuntu-26.04:
              imageName: 'ubuntu-26.04'
            macos-26:
              imageName: 'macos-26'
        pool:
          vmImage: $(imageName)
        steps:
          - checkout: self
            fetchDepth: 0

          - task: gittools.gittools.setup-gitversion-task.gitversion-setup@5.0.0
            displayName: Install GitVersion
            inputs:
              versionSpec: '7.0.x'

          - task: gittools.gittools.execute-gitversion-task.gitversion-execute@5.0.0
            name: version_step # step id used as a reference for output values
            displayName: Use GitVersion
            inputs:
              buildNumberFormat: 'v${GitVersion_MajorMinorPatch}'
              overrideConfig: |
                calculation.semantic-version-format=Loose

          - pwsh: |
              echo "FullSemVer (fullSemVer)                         : $(fullSemVer)"
              echo "FullSemVer (GitVersion_FullSemVer)              : $(GitVersion_FullSemVer)"
              echo "FullSemVer (version_step.fullSemVer)            : $(version_step.fullSemVer)"
              echo "FullSemVer (version_step.GitVersion_FullSemVer) : $(version_step.GitVersion_FullSemVer)"
            displayName: Use variables and output